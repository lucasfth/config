# SSH-safe tmux overrides — ASCII status bar, no Nerd Font glyphs.
# Used when $SSH_CONNECTION or $SSH_TTY is set.

source-file ~/.tmux.conf

# ── Status bar (ASCII — no Nerd Font glyphs) ──────────────────────────────────
set -g status-left-length 60
set -g status-left "\
#[fg=#cba6f7,bg=default] [#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=default]] "

set -g status-right-length 140
set -g status-right "\
#[fg=#74c7ec] user:#(whoami) @#H \
#[fg=#f9e2af] CPU:#{cpu_percentage} \
#[fg=#cba6f7] RAM:#{ram_percentage} \
#[fg=#fab387] BAT:#{battery_percentage} \
#[fg=#a6e3a1] %Y-%m-%d %H:%M"

# ── Window status ─────────────────────────────────────────────────────────────
set -g window-status-format         "#[fg=#6c7086,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#f9e2af,bg=default][#[fg=#1e1e2e,bg=#f9e2af,bold]#I:#W#[fg=#f9e2af,bg=default]]"
set -g window-status-separator      ""

# ── Reload from THIS config, not the main one ──────────────────────────────────
unbind r
bind r source-file ~/.tmux-ssh.conf \; display "reloaded"
