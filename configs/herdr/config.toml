# Herdr configuration — managed by nix/home-manager.
# Defaults that match the tmux config are left explicit for clarity.

onboarding = false

[terminal]
default_shell = "zsh"

[theme]
name = "catppuccin"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+b"
# Ghostty's agent key table sends these prefix-qualified transport chords.
# Keep normal prefix+h/j/k/l pane and prefix+1..9 tab navigation unchanged.
next_agent = "prefix+ctrl+j"
previous_agent = "prefix+ctrl+k"
focus_agent = "prefix+alt+1..9"

# ── Split panes (match tmux: bind | / bind -) ──
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# ── Reload (match tmux: bind r source-file) ──
reload_config = "prefix+r"

# ── Detach (match tmux: prefix+d) ──
detach = "prefix+d"
