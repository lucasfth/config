# Herdr configuration — managed by nix/home-manager.
# Defaults that match the tmux config are left explicit for clarity.

onboarding = false

[terminal]
default_shell = "zsh"

[theme]
name = "catppuccin"

[ui]
sidebar_min_width = 26

# Only the first workspace on each machine receives these host-summary tokens.
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["$host_load"],
  ["$host_storage"],
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+b"
# Ghostty's agent key table sends these prefix-qualified transport chords.
# Keep normal prefix+h/j/k/l pane and prefix+1..9 tab navigation unchanged.
next_agent = "prefix+ctrl+j"
previous_agent = "prefix+ctrl+k"
# Alt+8 types [ on Danish keyboards; keep it free for copy mode.
focus_agent = "prefix+ctrl+alt+1..9"
copy_mode = ["prefix+[", "prefix+alt+[", "prefix+alt+8"]

# ── Split panes (match tmux: bind | / bind -) ──
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# ── Reload (match tmux: bind r source-file) ──
reload_config = "prefix+r"

# ── Detach (match tmux: prefix+d) ──
detach = "prefix+d"
