# Private Hbit menu; public DNS continues to serve the website.
Host hbit.sh hbit
    HostName 127.0.0.1
    Port 2222
    User hbit
    HostKeyAlias hbit-private-gimle
    UserKnownHostsFile ~/.ssh/known_hosts.hbit
    GlobalKnownHostsFile /dev/null
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    UpdateHostKeys no
    ForwardAgent no
    ForwardX11 no
    ClearAllForwardings yes
    RequestTTY yes
    ProxyCommand /usr/bin/ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o ForwardAgent=no -W 127.0.0.1:2222 gimle
